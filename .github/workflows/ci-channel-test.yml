name: CI (channels/test)

on:
  push:
    branches:
      - releases/1.15
      - feat/fluent-v9*
      - feat/dependency-upgrades*
    paths:
      - 'SharePointFramework/**'
      - 'Install/**'
      - 'Templates/**'
      - 'e2e/**'
      - .github/workflows/ci-channel-test.yml
  # Manual runs, for example to re-run the end-to-end smoke after fixing a secret or a spec.
  workflow_dispatch:

# One run at a time, whatever the branch: every run deploys to the same test hub and app catalog,
# so two at once can overwrite each other mid-run (on 2026-10-06 an [apps-only] run's packages
# landed in the middle of a full run's template step). A newer run waits for the running one.
# GitHub keeps only the newest waiting run in a group and cancels an older waiting one: on one
# branch the newer commit holds the older one's changes, but a cancelled full run's templates are
# not applied, so push the commit that needs the full run last.
concurrency:
  group: ci-channel-test
  cancel-in-progress: false

env:
  # Heft's TypeScript and webpack steps need more than V8's default heap (about 2 GB on a small
  # runner): the PortfolioWebParts production build dies at 2 GB and passes at 3 GB. 8 GB matches
  # the headroom the gulp toolchain used. RUSH_PARALLELISM bounds concurrent solution builds so
  # the heap ceilings cannot add up past the runner's memory.
  NODE_OPTIONS: --max-old-space-size=8192
  RUSH_PARALLELISM: 2
  CI_CERT_BASE64: ${{ secrets.CI_CERT_BASE64 }}
  CI_TENANT: ${{ secrets.CI_TENANT }}
  CI_CLIENT_ID: ${{ secrets.CI_CLIENT_ID }}

jobs:
  # Tags like [skip-ci] and [apps-only] must only be honored when present in the
  # commit *subject* (first line). Squash-merge commit bodies inherit the PR's
  # commit bullets, so matching the full message can skip or reroute builds
  # unintentionally.
  commit_subject:
    name: Determine commit subject
    runs-on: ubuntu-latest
    outputs:
      subject: ${{ steps.subject.outputs.subject }}
    steps:
      - name: Extract first line of commit message
        id: subject
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: echo "subject=${COMMIT_MESSAGE%%$'\n'*}" >> "$GITHUB_OUTPUT"

  build_release_package_test:
    needs: [commit_subject]
    name: Build release package (test channel)
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.commit_subject.outputs.subject, '[skip-ci]') && !contains(needs.commit_subject.outputs.subject, '[apps-only') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set sha_short
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run Install/Build-Release.ps1 in CI mode for channel test
        # The run number becomes the fourth segment of every package version, so each deployment
        # is a new version to SharePoint and clients refetch the manifests (see .tasks/README.md).
        env:
          PP365_BUILD_NUMBER: ${{ github.run_number }}
        run: Install/Build-Release.ps1 -CI -SkipBundle -Channel test
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-package-test
          path: release
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

  upgrade_channel_test:
    needs: [commit_subject, build_release_package_test]
    name: Upgrade (test channel)
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.commit_subject.outputs.subject, '[skip-upgrade]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package-test
          path: release

      - name: Upgrade
        run: release/Install.ps1 -Url "${{ vars.SP_URL_TEST }}" -Upgrade -CI -Tenant ${{ env.CI_TENANT }} -CertificateBase64Encoded ${{ env.CI_CERT_BASE64 }} -ClientId ${{ env.CI_CLIENT_ID }}
        shell: pwsh

  upgrade_all_sites_to_latest:
    needs: [commit_subject, build_release_package_test, upgrade_channel_test]
    name: Upgrade all sites to latest (test channel)
    runs-on: ubuntu-latest
    if: ${{ contains(needs.commit_subject.outputs.subject, '[upgrade-all-sites-to-latest]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package-test
          path: release

      - name: Run script UpgradeAllSitesToLatest.ps1 in CI mode
        run: release/Scripts/UpgradeAllSitesToLatest.ps1 -Url ${{ vars.SP_URL_TEST }} -CI -Tenant ${{ env.CI_TENANT }} -CertificateBase64Encoded ${{ env.CI_CERT_BASE64 }} -ClientId ${{ env.CI_CLIENT_ID }}
        shell: pwsh

  build_release_package_test_packages_only:
    needs: [commit_subject]
    name: Build release package - packages only (test channel)
    runs-on: ubuntu-latest
    if: ${{ contains(needs.commit_subject.outputs.subject, '[apps-only')}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set sha_short
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Determine apps-only solutions
        id: appsonly
        env:
          COMMIT_MSG: ${{ needs.commit_subject.outputs.subject }}
        run: |
          $solutions = ''
          if ($env:COMMIT_MSG -match '\[apps-only:([^\]]+)\]') {
            $solutions = (($matches[1] -split ',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }) -join ','
          }
          "solutions=$solutions" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Run Install/Build-Release.ps1 in CI mode for channel test
        # The rebuild's timeline goes to the log and the job summary. PnP.PowerShell is not
        # installed: only the PnP templates use it, and this job skips them (proven in
        # ci-build-debug.yml).
        env:
          SOLUTIONS: ${{ steps.appsonly.outputs.solutions }}
          PP365_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOLUTIONS)) {
            Install/Build-Release.ps1 -CI -SkipBundle -SkipBuildPnPTemplates -Channel test -RushTimeline -SkipPnPPowerShell
          }
          else {
            Install/Build-Release.ps1 -CI -SkipBundle -SkipBuildPnPTemplates -Channel test -RushTimeline -SkipPnPPowerShell -Solutions ($env:SOLUTIONS -split ',')
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-package-test
          path: release
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}

  upgrade_channel_test_packages_only:
    needs: [commit_subject, build_release_package_test_packages_only]
    name: Upgrade packages only (test channel)
    runs-on: ubuntu-latest
    if: ${{ !contains(needs.commit_subject.outputs.subject, '[skip-upgrade]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package-test
          path: release

      - name: Upgrade
        run: release/Install.ps1 -Url "${{ vars.SP_URL_TEST }}" -Upgrade -CI -Tenant ${{ env.CI_TENANT }} -CertificateBase64Encoded ${{ env.CI_CERT_BASE64 }} -ClientId ${{ env.CI_CLIENT_ID }} -SkipTemplate
        shell: pwsh

  e2e_smoke_test_channel:
    # Two upgrade paths lead here: the full upgrade, and the packages-only upgrade used by
    # [apps-only] commits. Exactly one of them runs; the smoke tests follow whichever succeeded.
    needs: [commit_subject, upgrade_channel_test, upgrade_channel_test_packages_only]
    name: End-to-end smoke (test channel)
    runs-on: ubuntu-latest
    if: ${{ always() && (needs.upgrade_channel_test.result == 'success' || needs.upgrade_channel_test_packages_only.result == 'success') && !contains(needs.commit_subject.outputs.subject, '[skip-e2e]') }}
    env:
      E2E_BASE_URL: ${{ vars.SP_URL_TEST }}
      E2E_PROJECT_URL: ${{ vars.E2E_PROJECT_URL }}
      E2E_PROGRAM_URL: ${{ vars.E2E_PROGRAM_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pp365-e2e
        run: node common/scripts/install-run-rush.js install --to pp365-e2e

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run smoke tests against the test channel
        run: npx playwright test
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-test-channel
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
