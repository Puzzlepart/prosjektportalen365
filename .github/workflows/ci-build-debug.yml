name: CI (build debug)

# Builds the test channel's release package as the live packages-only job does, without deploying
# it, so changes to the build itself (Install/Build-Release.ps1 switches, the Rush and Heft setup)
# can be tried and measured before the live workflows take them (phase 5, slice 1c). It needs no
# secrets and touches no tenant.
#
# Runs on a push whose commit subject carries [build-debug]. Put [skip-ci] in the same subject to
# keep the live test-channel workflow from building and deploying that commit. workflow_dispatch
# works once this file is on the default branch.
on:
  push:
    branches:
      - releases/1.15
      - 'feat/**'
  workflow_dispatch:

env:
  # The live workflow's heap and parallelism, so the times compare.
  NODE_OPTIONS: --max-old-space-size=8192
  RUSH_PARALLELISM: 2

jobs:
  # Only the subject (first line) counts, as in the live workflow: squash-merge bodies carry the
  # branch's commit subjects.
  commit_subject:
    name: Determine commit subject
    runs-on: ubuntu-latest
    outputs:
      subject: ${{ steps.subject.outputs.subject }}
    steps:
      - name: Extract first line of commit message
        id: subject
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: echo "subject=${COMMIT_MESSAGE%%$'\n'*}" >> "$GITHUB_OUTPUT"

  build:
    needs: [commit_subject]
    name: Build release package (${{ matrix.variant }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(needs.commit_subject.outputs.subject, '[build-debug]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Today's rebuild, the baseline the others are compared with.
          - variant: classic
            phased: false
            parallelism: 2
          # The phased rebuild (rush rebuild-phased): a solution builds once its dependencies have
          # built, and their tests run beside it. At the live parallelism, and at one more.
          - variant: phased-p2
            phased: true
            parallelism: 2
          - variant: phased-p3
            phased: true
            parallelism: 3
    env:
      RUSH_PARALLELISM: ${{ matrix.parallelism }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run Install/Build-Release.ps1 in CI mode for channel test
        # The live packages-only job's arguments, plus the rebuild's timeline (printed here and in
        # the job summary), and without PnP.PowerShell, which only the skipped PnP templates use.
        env:
          PP365_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $switches = @{ RushTimeline = $true; SkipPnPPowerShell = $true; PhasedBuild = ('${{ matrix.phased }}' -eq 'true') }
          Install/Build-Release.ps1 -CI -SkipBundle -SkipBuildPnPTemplates -Channel test @switches
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: release-package-debug-${{ matrix.variant }}
          path: release

      - name: Upload the Rush logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rush-logs-debug-${{ matrix.variant }}
          path: |
            SharePointFramework/rush-*.build.log
            SharePointFramework/*/rush-logs/
            Templates/rush-logs/
            e2e/rush-logs/
          if-no-files-found: warn

  # The variants build the same commit with the same run number, so their packages must hold the
  # same files with the same bytes; the zip containers themselves differ in their timestamps.
  compare:
    needs: [build]
    name: Compare the variants
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result != 'skipped' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-package-debug-*
          path: packages

      - uses: actions/download-artifact@v4
        with:
          pattern: rush-logs-debug-*
          path: logs

      - name: Compare the packages with the classic build's, and the times
        run: |
          set -uo pipefail
          summary() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          summary "### Rebuild times"
          summary ""
          summary "| Variant | Wall clock | Total work | Average parallelism |"
          summary "|---|---|---|---|"
          for log in logs/*/SharePointFramework/rush-rebuild.build.log; do
            variant=$(basename "$(dirname "$(dirname "$log")")" | sed 's/^rush-logs-debug-//')
            wall=$(grep -o -E 'Wall Clock: [0-9.]+s' "$log" | grep -o -E '[0-9.]+s' || echo '?')
            work=$(grep -o -E 'Total Work: [0-9.]+s' "$log" | grep -o -E '[0-9.]+s' || echo '?')
            avg=$(grep -o -E 'Avg Parallelism Used: [0-9.]+' "$log" | grep -o -E '[0-9.]+$' || echo '?')
            summary "| $variant | $wall | $work | $avg |"
          done
          summary ""
          summary "### Packages against the classic build"
          summary ""
          for dir in packages/*/; do
            variant=$(basename "$dir" | sed 's/^release-package-debug-//')
            for sppkg in "$dir"Apps/*.sppkg; do
              target="unpacked/$variant/$(basename "$sppkg" .sppkg)"
              mkdir -p "$target" && unzip -q -o "$sppkg" -d "$target"
            done
          done
          status=0
          if [ ! -d unpacked/classic ]; then summary "No classic package to compare with."; exit 1; fi
          for variant_dir in unpacked/*/; do
            variant=$(basename "$variant_dir")
            [ "$variant" = classic ] && continue
            if diff -r -q unpacked/classic "$variant_dir" > "diff-$variant.txt"; then
              summary "- **$variant**: the same files with the same bytes as classic ($(find "$variant_dir" -type f | wc -l | tr -d ' ') files in $(ls "$variant_dir" | wc -l | tr -d ' ') packages)."
            else
              summary "- **$variant**: differs from classic:"
              summary '```'
              summary "$(head -50 "diff-$variant.txt")"
              summary '```'
              status=1
            fi
          done
          exit $status
