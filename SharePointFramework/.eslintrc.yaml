env:
  browser: true
parser: "@typescript-eslint/parser"
extends:
  - "prettier"
  - "plugin:react/recommended"
  - "plugin:@typescript-eslint/recommended"
plugins:
  - "prettier"
  - "unused-imports"
parserOptions:
  ecmaVersion: 2018
  sourceType: module
  ecmaFeatures:
    jsx: true
rules:
  "@typescript-eslint/interface-name-prefix": 0
  "@typescript-eslint/no-explicit-any": 0
  "@typescript-eslint/member-delimiter-style": 0
  "@typescript-eslint/explicit-function-return-type": 0
  "@typescript-eslint/explicit-module-boundary-types": 0
  "@typescript-eslint/no-inferrable-types": 0
  "react/prop-types": 0
  "no-inferrable-types": 0
  "react/display-name": 0
  "no-compare-neg-zero": 1
  "no-console": 1
  "default-case": 0
  "eqeqeq": 1
  "max-classes-per-file": 0
  "jsx-quotes":
    - "error"
    - "prefer-single"
  quotes:
    - "error"
    - "single"
  yoda: 2
  "require-await": 1
  semi:
    - "error"
    - "never"
    - {}
  "unused-imports/no-unused-imports": "error"
  "no-restricted-syntax":
    - "error"
    - selector: "ImportDeclaration[source.value='@fluentui/react-icons'] > ImportNamespaceSpecifier"
      message: "Never `import * as ... from '@fluentui/react-icons'` (bloats every bundle). Use named imports via the shared-library icon catalog (SharePointFramework/shared-library/src/icons/iconCatalog.ts)."
  "no-restricted-imports":
    - "error"
    - paths:
        - name: "pp365-shared-library/lib/icons/iconCatalog"
          message: "Do not deep-import the icon catalog. Use getFluentIcons/resolveFluentIcon from 'pp365-shared-library'."
settings:
  react:
    version: "detect"
